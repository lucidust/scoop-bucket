name: Update wnlctl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update manifest
        id: update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view --repo lucidust/wnlctl --json tagName,assets | ConvertFrom-Json
          $version = $release.tagName.TrimStart('v')
          $asset = $release.assets | Where-Object { $_.name -eq 'wnlctl-windows-x64.zip' } | Select-Object -First 1

          if (-not $asset) {
            throw "Release $($release.tagName) does not include wnlctl-windows-x64.zip"
          }

          if (-not $asset.digest -or -not $asset.digest.StartsWith('sha256:')) {
            throw "Release asset does not expose a SHA256 digest"
          }

          $hash = $asset.digest.Substring('sha256:'.Length)
          $manifestPath = 'bucket/wnlctl.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = "https://github.com/lucidust/wnlctl/releases/download/$($release.tagName)/wnlctl-windows-x64.zip"
          $manifest.architecture.'64bit'.hash = $hash
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath

          $changedFiles = git diff --name-only -- $manifestPath
          if (-not $changedFiles) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Commit manifest
        if: steps.update.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content bucket/wnlctl.json -Raw | ConvertFrom-Json).version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/wnlctl.json
          git commit -m "wnlctl: Update to version $version"
          git push
